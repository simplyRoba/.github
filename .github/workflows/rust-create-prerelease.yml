name: Rust Create Prerelease

on:
  workflow_call:
    secrets:
      RELEASE_BOT_CLIENT_ID:
        description: Client ID of the GitHub App used by Release Please
        required: true
      RELEASE_BOT_PRIVATE_KEY:
        description: Private key of the GitHub App used by Release Please
        required: true

permissions:
  contents: read

jobs:
  prerelease:
    name: Create Rust prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: rust-create-prerelease-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Generate release bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.RELEASE_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: Find pending Release Please pull request
        id: release-pr
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          default_branch=$(gh repo view "$GITHUB_REPOSITORY" --json defaultBranchRef --jq '.defaultBranchRef.name')
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" \
            --state open --base "$default_branch" --label 'autorelease: pending' \
            --json number,url,headRefOid,body)

          count=$(jq 'length' <<<"$prs")
          if [[ "$count" -ne 1 ]]; then
            echo "::error::Expected exactly one open 'autorelease: pending' pull request targeting '${default_branch}', found ${count}."
            exit 1
          fi

          notes_file="${RUNNER_TEMP}/release-please-notes.md"
          jq -r '.[0].body // ""' <<<"$prs" >"$notes_file"

          {
            echo "head_sha=$(jq -r '.[0].headRefOid' <<<"$prs")"
            echo "pr_url=$(jq -r '.[0].url' <<<"$prs")"
            echo "notes_file=$notes_file"
          } >>"$GITHUB_OUTPUT"

          echo "Using Release Please PR #$(jq -r '.[0].number' <<<"$prs")."

      - name: Checkout Release Please candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-pr.outputs.head_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Determine prerelease version
        id: version
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          read -r package_name candidate < <(cargo metadata --format-version 1 --no-deps --locked \
            | jq -r '.workspace_root as $root
                     | .packages[]
                     | select(.manifest_path == ($root + "/Cargo.toml"))
                     | "\(.name) \(.version)"')

          if [[ ! "$candidate" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Root Cargo version '${candidate}' is not a stable X.Y.Z version."
            exit 1
          fi

          next=1
          while read -r tag; do
            number=${tag#"v${candidate}-next."}
            [[ "$number" =~ ^[1-9][0-9]*$ ]] || continue
            if (( number >= next )); then
              next=$((number + 1))
            fi
          done < <(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v${candidate}-next." \
            --jq '.[].ref | sub("^refs/tags/"; "")')

          prerelease="${candidate}-next.${next}"
          {
            echo "package_name=$package_name"
            echo "version=$prerelease"
            echo "tag=v$prerelease"
          } >>"$GITHUB_OUTPUT"

          echo "Preparing prerelease ${prerelease} for ${package_name}."

      - name: Install Cargo manifest version tool
        run: cargo install set-cargo-version --version 1.2.1 --locked

      - name: Apply Cargo prerelease version
        env:
          PACKAGE_NAME: ${{ steps.version.outputs.package_name }}
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          set-cargo-version Cargo.toml "$PRERELEASE_VERSION"
          cargo update --package "$PACKAGE_NAME" --precise "$PRERELEASE_VERSION"
          cargo metadata --locked --format-version 1 >/dev/null

          changed=$(git status --porcelain | awk '{print $2}' | sort | paste -sd, -)
          if [[ "$changed" != "Cargo.lock,Cargo.toml" ]]; then
            echo "::error::Expected only Cargo.toml and Cargo.lock to change, got: ${changed}"
            exit 1
          fi

      - name: Create and push synthetic prerelease tag
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PRERELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -Eeuo pipefail

          bot_id=$(gh api "/users/${APP_SLUG}[bot]" --jq '.id')
          gh auth setup-git
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"

          git add Cargo.toml Cargo.lock
          git commit -m "chore: prepare ${PRERELEASE_VERSION} prerelease"
          git tag "$PRERELEASE_TAG"
          git push origin "refs/tags/${PRERELEASE_TAG}"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NOTES_FILE: ${{ steps.release-pr.outputs.notes_file }}
          PRERELEASE_TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_PR_URL: ${{ steps.release-pr.outputs.pr_url }}
        shell: bash
        run: |
          set -Eeuo pipefail

          release_notes="${RUNNER_TEMP}/prerelease-notes.md"
          {
            echo "Prerelease of **${PRERELEASE_VERSION}**, built from the current Release Please candidate: ${RELEASE_PR_URL}."
            echo
            echo "---"
            echo
            cat "$NOTES_FILE"
          } >"$release_notes"

          gh release create "$PRERELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "$PRERELEASE_VERSION" \
            --notes-file "$release_notes"
