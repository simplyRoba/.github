name: Update Major Version Tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-major-tag:
    name: Update movable major tag
    # A published prerelease must never update a stable major pointer.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: update-major-version-tag-${{ github.repository }}
      cancel-in-progress: false
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Validate release tag and update major tag
        shell: bash
        run: |
          set -Eeuo pipefail

          # Accept only immutable stable version tags such as v1.2.3.
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Stable release tag '${RELEASE_TAG}' must match vMAJOR.MINOR.PATCH without leading zeroes."
            exit 1
          fi

          major_tag="v${BASH_REMATCH[1]}"
          git init --quiet
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          auth_header=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')
          git config http.https://github.com/.extraheader "AUTHORIZATION: basic ${auth_header}"

          git fetch --no-tags origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          release_commit=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")

          # Force-update only the derived movable tag (v1, v2, ...).
          git update-ref "refs/tags/${major_tag}" "$release_commit"
          git push --force origin \
            "refs/tags/${major_tag}:refs/tags/${major_tag}"

          echo "Updated ${major_tag} to ${release_commit} from ${RELEASE_TAG}."
